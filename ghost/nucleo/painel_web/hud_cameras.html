<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost · Planta das câmeras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Planta das câmeras em 3D: as paredes saem da planta do croqui; cada câmera é um ponto com o "leque" do que ela vê.
   Quando o gravador acusa movimento/pessoa, um boneco aparece e anda DENTRO daquela área (posição ilustrativa:
   o gravador diz QUE tem alguém na área, não ONDE). Só mostra; o gravador não muda. */
:root {
  --obsidiana: #0d0a08; --tabua: #17110c; --tabua-2: #1f1710;
  --fio: rgba(232, 176, 75, .16); --fio-forte: rgba(232, 176, 75, .38);
  --brasa: #ff6a1a; --ouro: #e8b04b; --cinza-quente: #e9dcc6; --apagado: #9a8770;
  --sangue: #e0503a; --verdete: #8fbf9f; --movimento: #6fb7c9;
  --f-titulo: "Cinzel", Georgia, serif; --f-texto: "Spectral", Georgia, serif;
  --f-numero: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--obsidiana); color: var(--cinza-quente); font: 15px/1.45 var(--f-texto); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 18px; border-bottom: 1px solid var(--fio); }
h1 { margin: 0; font: 700 20px/1 var(--f-titulo); letter-spacing: .28em; color: var(--ouro); white-space: nowrap; }
.contas { display: flex; gap: 16px; font: 13px var(--f-numero); color: var(--apagado); flex-wrap: wrap; }
.contas b { color: var(--cinza-quente); font-weight: 600; }
.contas .ruim b { color: var(--sangue); }
.contas .bom b { color: var(--verdete); }
.ferramentas { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
button {
  background: var(--tabua); border: 1px solid var(--fio-forte); color: var(--ouro); border-radius: 6px; padding: 6px 12px;
  font: 600 11px var(--f-titulo); letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
}
button:hover { border-color: var(--ouro); }
button.forte { background: var(--ouro); color: var(--obsidiana); }
button[aria-pressed=true] { background: var(--ouro); color: var(--obsidiana); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brasa); outline-offset: 2px; }
main { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding: 14px 18px; height: calc(100% - 58px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #cena { height: 60vh; } }
#cena { position: relative; background: var(--tabua); border: 1px solid var(--fio); border-radius: 10px; overflow: hidden; min-height: 320px; }
#cena canvas { display: block; width: 100%; height: 100%; }
#cena.editando { cursor: crosshair; }
#dica { position: absolute; left: 12px; bottom: 10px; font-size: 12.5px; color: var(--apagado); pointer-events: none; }
#erro3d { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--apagado); }
aside { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.caixa { background: var(--tabua); border: 1px solid var(--fio); border-radius: 10px; padding: 14px 16px; }
.caixa h2 { margin: 0 0 8px; font: 700 13px var(--f-titulo); letter-spacing: .14em; color: var(--ouro); }
.sub { color: var(--apagado); font-size: 13px; }
.aviso { border-color: var(--sangue); }
.aviso h2 { color: var(--sangue); }
.tela { aspect-ratio: 352 / 240; background: #000; border: 1px solid var(--fio); border-radius: 6px; display: grid; place-items: center; overflow: hidden; margin: 8px 0; }
.tela img { width: 100%; height: 100%; object-fit: contain; }
.tela span { color: var(--apagado); font-size: 13px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--fio); font-size: 13.5px; }
li span:last-child { color: var(--apagado); font-family: var(--f-numero); font-size: 12px; white-space: nowrap; }
.canais { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 10px; }
.canais button { padding: 6px 4px; font: 600 12px var(--f-numero); letter-spacing: 0; text-transform: none; color: var(--apagado); }
.canais button.na-planta { color: var(--ouro); }
.canais button[aria-pressed=true] { color: var(--obsidiana); }
label { display: grid; gap: 3px; font-size: 12.5px; color: var(--apagado); margin-top: 8px; }
select { background: var(--obsidiana); border: 1px solid var(--fio-forte); color: var(--cinza-quente); border-radius: 6px; padding: 6px 8px; font: 14px var(--f-texto); }
input[type=text] { background: var(--obsidiana); border: 1px solid var(--fio-forte); color: var(--cinza-quente); border-radius: 6px; padding: 6px 8px; font: 14px var(--f-texto); }
.linha { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tag-pessoa { color: var(--brasa); } .tag-movimento { color: var(--movimento); }
</style>
</head>
<body>
<header>
  <h1>PLANTA DAS CÂMERAS</h1>
  <div class="contas" id="contas"></div>
  <div class="ferramentas">
    <button id="bt-vista" type="button" aria-pressed="false">Vista de cima</button>
    <button id="bt-editar" type="button">Posicionar câmeras</button>
    <button id="bt-salvar" type="button" class="forte" hidden>Salvar</button>
    <button id="bt-cancelar" type="button" hidden>Cancelar</button>
  </div>
</header>
<main>
  <div id="cena">
    <div id="erro3d" hidden></div>
    <div id="dica">Arraste para girar · roda do mouse para aproximar · botão direito para mover</div>
  </div>
  <aside>
    <div class="caixa aviso" id="aviso" hidden><h2>CÂMERAS</h2><div id="aviso-texto"></div></div>
    <div class="caixa" id="edicao" hidden>
      <h2>POSICIONAR</h2>
      <div class="sub">Escolha o canal e clique no chão da planta onde a câmera fica. Gire para apontar o leque.</div>
      <div class="canais" id="lista-canais"></div>
      <div id="edicao-cam"></div>
    </div>
    <div class="caixa" id="ficha"><h2>DETALHE</h2><div class="sub">Clique numa câmera para ver a imagem ao vivo.</div></div>
    <div class="caixa"><h2>ÚLTIMOS EVENTOS</h2><ul id="ultimos"></ul></div>
    <div class="caixa sub" id="rodape"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const TOKEN = "__GHOST_TOKEN__";
const DEMO = TOKEN.startsWith("__");
const $ = id => document.getElementById(id);
const q = s => `${s}${s.includes("?") ? "&" : "?"}t=${encodeURIComponent(TOKEN)}`;
const hora = t => new Date(t * 1000).toLocaleTimeString("pt-BR");
const COR = { ouro: 0xe8b04b, brasa: 0xff6a1a, movimento: 0x6fb7c9, parede: 0x3a2c1f, piso: 0x1a130d, pisoSala: 0x221910 };
const RAIO_LEQUE = 170, ABERTURA = 70;                // alcance e ângulo do "leque" de cada câmera (unidades da planta)

let dados = null, editando = false, rascunho = [], canalSel = null, verCanal = null, fotoUrl = null;
const nomeCam = c => c.nome || (dados.titulos[c.canal] || `CAM ${c.canal}`);

// ---------------------------------------------------------------- dados (demonstração quando aberto fora do Ghost)
function demo() {
  const agora = Date.now() / 1000, fase = Math.floor(agora / 8) % 3;
  return { gerado: agora, configurado: true, estado: "conectado", erro: null, gravador: "demonstração",
    titulos: Object.fromEntries(Array.from({ length: 18 }, (_, i) => [i + 1, `CAM ${i + 1}`])),
    planta: { largura: 960, altura: 1280, pe_direito: 70, salas: [
      { id: "salao", nome: "Salão", x: 240, y: 260, w: 520, h: 840, fundo: true },
      { id: "almox", nome: "Almoxarifado", x: 240, y: 80, w: 520, h: 180 },
      { id: "deborah", nome: "Sala Deborah", x: 240, y: 260, w: 160, h: 160 },
      { id: "financeiro", nome: "Financeiro", x: 540, y: 260, w: 220, h: 160 },
      { id: "rh", nome: "RH", x: 520, y: 760, w: 240, h: 220 },
      { id: "reuniao", nome: "Sala reunião", x: 520, y: 980, w: 240, h: 120 },
      { id: "copa", nome: "Copa", x: 240, y: 1100, w: 180, h: 100 },
      { id: "banh_f", nome: "Banh. F", x: 420, y: 1100, w: 50, h: 100 },
      { id: "banh_m", nome: "Banh. M", x: 470, y: 1100, w: 50, h: 100 },
      { id: "servidor", nome: "Servidor", x: 520, y: 1100, w: 240, h: 100 },
      { id: "entrada", nome: "Entrada", x: 80, y: 880, w: 160, h: 320, aberta: true }],
      moveis: [{ nome: "ADM", x: 620, y: 480, w: 60, h: 200 }], portoes: [{ x1: 240, y1: 880, x2: 240, y2: 1100 }],
      cameras: [{ canal: 1, x: 746, y: 969, ang: 225, nome: "" }, { canal: 3, x: 641, y: 757, ang: 270, nome: "" },
                { canal: 4, x: 750, y: 270, ang: 135, nome: "" }, { canal: 14, x: 230, y: 1150, ang: 0, nome: "" }] },
    canais: fase === 0 ? { 1: "pessoa", 4: "movimento" } : fase === 1 ? { 3: "pessoa" } : { 14: "movimento" },
    ultimos: [{ t: agora - 20, canal: 1, tipo: "pessoa" }, { t: agora - 70, canal: 4, tipo: "movimento" }] };
}

// ---------------------------------------------------------------- cena 3D
let renderer, cena, camera, controles, raio, chao, grupoPlanta, grupoCams, larguraP = 960, alturaP = 1280;
const bonecos = new Map();                            // canal -> {grupo, alvo, tipo, sumindo}
const objCams = new Map();                            // canal -> grupo da câmera (para o clique)
let assinaturaPlanta = "", assinaturaCams = "";

function iniciar3D() {
  if (!window.THREE || !THREE.OrbitControls) {
    $("erro3d").hidden = false;
    $("erro3d").textContent = "Não consegui carregar o 3D (sem internet para baixar o three.js). A lista de eventos continua funcionando.";
    return false;
  }
  const caixa = $("cena");
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x17110c);
  renderer.localClippingEnabled = true;               // recorta o leque de cada câmera nas paredes da sala dela
  caixa.prepend(renderer.domElement);
  cena = new THREE.Scene();
  cena.fog = new THREE.Fog(0x17110c, 1400, 2600);
  camera = new THREE.PerspectiveCamera(45, 1, 5, 5000);
  camera.position.set(480 - 520, 760, 640 + 860);
  controles = new THREE.OrbitControls(camera, renderer.domElement);
  controles.target.set(480, 0, 640);
  controles.maxPolarAngle = Math.PI / 2.15;
  controles.enableDamping = true;
  controles.update();
  cena.add(new THREE.HemisphereLight(0xffe9c8, 0x1a120a, 0.75));
  const sol = new THREE.DirectionalLight(0xffe0b0, 0.6);
  sol.position.set(-300, 900, 200);
  cena.add(sol);
  raio = new THREE.Raycaster();
  chao = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshBasicMaterial({ visible: false }));
  chao.rotation.x = -Math.PI / 2;
  cena.add(chao);
  grupoPlanta = new THREE.Group(); grupoCams = new THREE.Group();
  cena.add(grupoPlanta, grupoCams);
  new ResizeObserver(redimensionar).observe(caixa);
  redimensionar();
  renderer.domElement.addEventListener("pointerdown", e => { clique0 = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", aoClicar);
  requestAnimationFrame(animar);
  return true;
}
function descartar(grupo) {                           // libera a memória da placa de vídeo ao redesenhar
  grupo.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
  });
}
function redimensionar() {
  const r = $("cena").getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}

function texto(t, cor = "#e9dcc6", tamanho = 44) {    // etiqueta como textura (sem fonte 3D)
  const c = document.createElement("canvas"), g = c.getContext("2d");
  g.font = `600 ${tamanho}px Spectral, Georgia, serif`;
  c.width = Math.ceil(g.measureText(t).width) + 24; c.height = tamanho + 20;
  g.font = `600 ${tamanho}px Spectral, Georgia, serif`;
  g.fillStyle = cor; g.textBaseline = "middle"; g.fillText(t, 12, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return { tex, w: c.width, h: c.height };
}
function rotuloChao(t, x, y, escala = 0.42) {
  const { tex, w, h } = texto(t.toUpperCase(), "#9a8770");
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w * escala, h * escala), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 1.5, y);
  return m;
}
function placa(t, cor) {                              // etiqueta que sempre olha para a câmera
  const { tex, w, h } = texto(t, cor, 40);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.scale.set(w * 0.55, h * 0.55, 1);
  return s;
}

function paredes(salas) {
  // une os segmentos que estão na mesma linha (parede compartilhada vira uma só, sem "piscar")
  const linhas = {};
  const add = (eixo, fixo, a, b) => { const k = eixo + fixo; (linhas[k] = linhas[k] || { eixo, fixo, iv: [] }).iv.push([Math.min(a, b), Math.max(a, b)]); };
  for (const s of salas) {
    if (s.aberta) continue;
    add("h", s.y, s.x, s.x + s.w); add("h", s.y + s.h, s.x, s.x + s.w);
    add("v", s.x, s.y, s.y + s.h); add("v", s.x + s.w, s.y, s.y + s.h);
  }
  const segs = [];
  for (const l of Object.values(linhas)) {
    l.iv.sort((a, b) => a[0] - b[0]);
    let [ini, fim] = l.iv[0];
    for (const [a, b] of l.iv.slice(1)) { if (a <= fim) fim = Math.max(fim, b); else { segs.push({ ...l, a: ini, b: fim }); [ini, fim] = [a, b]; } }
    segs.push({ ...l, a: ini, b: fim });
  }
  return segs;
}

function montarPlanta(p) {
  const assin = JSON.stringify([p.salas, p.moveis, p.portoes]);
  if (assin === assinaturaPlanta) return;
  assinaturaPlanta = assin; larguraP = p.largura; alturaP = p.altura;
  descartar(grupoPlanta); grupoPlanta.clear();
  const alto = p.pe_direito || 70, esp = 6;
  const matParede = new THREE.MeshStandardMaterial({ color: COR.parede, roughness: .9, transparent: true, opacity: .92 });
  const matTopo = new THREE.MeshBasicMaterial({ color: COR.ouro, transparent: true, opacity: .55 });
  for (const s of p.salas) {
    const piso = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.h),
      new THREE.MeshStandardMaterial({ color: s.fundo ? COR.piso : COR.pisoSala, roughness: 1 }));
    piso.rotation.x = -Math.PI / 2; piso.position.set(s.x + s.w / 2, s.fundo ? 0 : 0.5, s.y + s.h / 2);
    grupoPlanta.add(piso);
    if (s.w >= 80) grupoPlanta.add(rotuloChao(s.nome, s.x + s.w / 2, s.y + s.h / 2 + (s.fundo ? 0 : 0)));
    else { const r = rotuloChao(s.nome, s.x + s.w / 2, s.y + s.h / 2, 0.3); r.rotation.z = Math.PI / 2; grupoPlanta.add(r); }
  }
  for (const sg of paredes(p.salas)) {
    const comp = sg.b - sg.a + esp;
    const geo = sg.eixo === "h" ? new THREE.BoxGeometry(comp, alto, esp) : new THREE.BoxGeometry(esp, alto, comp);
    const m = new THREE.Mesh(geo, matParede);
    const meio = (sg.a + sg.b) / 2;
    m.position.set(sg.eixo === "h" ? meio : sg.fixo, alto / 2, sg.eixo === "h" ? sg.fixo : meio);
    grupoPlanta.add(m);
    const topo = new THREE.Mesh(sg.eixo === "h" ? new THREE.BoxGeometry(comp, 1, esp + 1) : new THREE.BoxGeometry(esp + 1, 1, comp), matTopo);
    topo.position.set(m.position.x, alto + 0.5, m.position.z);
    grupoPlanta.add(topo);
  }
  for (const mv of p.moveis || []) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(mv.w, 22, mv.h), new THREE.MeshStandardMaterial({ color: 0x4a3826, roughness: .8 }));
    m.position.set(mv.x + mv.w / 2, 11, mv.y + mv.h / 2);
    grupoPlanta.add(m);
    const r = rotuloChao(mv.nome, mv.x + mv.w / 2, mv.y + mv.h / 2, 0.32); r.position.y = 23; r.rotation.z = Math.PI / 2;
    grupoPlanta.add(r);
  }
  for (const pt of p.portoes || []) {                 // portão/grade: barras finas
    const dx = pt.x2 - pt.x1, dy = pt.y2 - pt.y1, n = Math.max(2, Math.round(Math.hypot(dx, dy) / 14));
    for (let i = 0; i <= n; i++) {
      const barra = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, alto * .8, 6), new THREE.MeshStandardMaterial({ color: COR.ouro }));
      barra.position.set(pt.x1 + dx * i / n, alto * .4, pt.y1 + dy * i / n);
      grupoPlanta.add(barra);
    }
  }
}

function leque(cor, opacidade) {
  const g = new THREE.CircleGeometry(RAIO_LEQUE, 24, -ABERTURA / 2 * Math.PI / 180, ABERTURA * Math.PI / 180);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: opacidade, depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2;
  return m;
}
function montarCameras() {
  const cams = editando ? rascunho : dados.planta.cameras;
  const assin = JSON.stringify([cams, editando ? canalSel : verCanal, editando ? {} : dados.canais]);
  if (assin === assinaturaCams) return;
  assinaturaCams = assin;
  descartar(grupoCams); grupoCams.clear(); objCams.clear();
  for (const c of cams) {
    const estado = editando ? null : dados.canais[c.canal];
    const sel = (editando ? canalSel : verCanal) === c.canal;
    const g = new THREE.Group();
    g.position.set(c.x, 0, c.y);
    const cor = estado === "pessoa" ? COR.brasa : estado === "movimento" ? COR.movimento : COR.ouro;
    const lq = leque(cor, estado ? .28 : .08);
    const s = salaDaCamera(c);
    lq.material.clippingPlanes = [new THREE.Plane(new THREE.Vector3(1, 0, 0), -s.x), new THREE.Plane(new THREE.Vector3(-1, 0, 0), s.x + s.w),
                                  new THREE.Plane(new THREE.Vector3(0, 0, 1), -s.y), new THREE.Plane(new THREE.Vector3(0, 0, -1), s.y + s.h)];
    lq.position.y = 2;
    lq.rotation.z = -c.ang * Math.PI / 180;            // ângulo da planta (0 = para a direita, sentido horário)
    g.add(lq);
    const poste = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 60, 8), new THREE.MeshStandardMaterial({ color: 0x6b5a45 }));
    poste.position.y = 30; g.add(poste);
    const corpo = new THREE.Mesh(new THREE.BoxGeometry(18, 12, 12), new THREE.MeshStandardMaterial({ color: sel ? COR.ouro : 0x2b2118, emissive: cor, emissiveIntensity: estado ? .6 : .15 }));
    corpo.position.y = 64; corpo.rotation.y = -c.ang * Math.PI / 180;
    g.add(corpo);
    const p = placa(`${c.canal} · ${nomeCam(c)} (${salaDaCamera(c).nome})`, sel ? "#ffcf7a" : "#e8b04b");
    p.position.y = 92; g.add(p);
    g.userData.canal = c.canal;
    g.traverse(o => { o.userData.canal = c.canal; });
    grupoCams.add(g); objCams.set(c.canal, g);
  }
}

// ---------------------------------------------------------------- bonecos (presença na área; andar é ilustrativo)
function novoBoneco(tipo) {
  const cor = tipo === "pessoa" ? COR.brasa : COR.movimento;
  const mat = new THREE.MeshStandardMaterial({ color: cor, emissive: cor, emissiveIntensity: .35, transparent: true, opacity: 1 });
  const g = new THREE.Group();
  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(7, 9, 30, 12), mat); tronco.position.y = 25;
  const cabeca = new THREE.Mesh(new THREE.SphereGeometry(7.5, 14, 10), mat); cabeca.position.y = 48;
  const perna1 = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 14, 6), mat); perna1.position.set(-4, 7, 0);
  const perna2 = perna1.clone(); perna2.position.x = 4;
  const etiqueta = placa(tipo === "pessoa" ? "Pessoa" : "Movimento", tipo === "pessoa" ? "#ff8a4a" : "#9fd6e4");
  etiqueta.position.y = 72;
  g.add(tronco, cabeca, perna1, perna2, etiqueta);
  g.userData = { mat, pernas: [perna1, perna2], etiqueta };
  cena.add(g);
  return g;
}
const dentro = (s, x, y, m = 0) => x > s.x + m && x < s.x + s.w - m && y > s.y + m && y < s.y + s.h - m;
function salaDaCamera(c) {
  // escolhida no "Posicionar" ou automática: a sala menor onde cai um ponto logo à frente da câmera
  // (câmera fica na parede; o ponto à frente cai do lado que ela vê)
  const salas = dados.planta.salas;
  if (c.sala) { const s = salas.find(x => x.id === c.sala); if (s) return s; }
  const a = c.ang * Math.PI / 180, fx = c.x + 30 * Math.cos(a), fy = c.y + 30 * Math.sin(a);
  const cand = salas.filter(s => dentro(s, fx, fy)).sort((p, q) => p.w * p.h - q.w * q.h);
  return cand.find(s => !s.fundo) || cand[0] || salas.find(s => dentro(s, c.x, c.y)) || salas[0];
}
function pontoNaArea(c) {                             // ponto dentro da SALA da câmera, de preferência no leque dela
  const s = salaDaCamera(c), m = 14;
  const outraSala = (x, y) => !s.fundo ? false : dados.planta.salas.some(o => !o.fundo && o !== s && dentro(o, x, y));
  for (let i = 0; i < 40; i++) {
    const a = (c.ang + (Math.random() - .5) * ABERTURA * .8) * Math.PI / 180, r = 30 + Math.random() * (RAIO_LEQUE - 40);
    const x = c.x + r * Math.cos(a), y = c.y + r * Math.sin(a);
    if (dentro(s, x, y, m) && !outraSala(x, y)) return { x, y };
  }
  for (let i = 0; i < 40; i++) {                      // leque quase todo fora da sala: qualquer ponto da sala
    const x = s.x + m + Math.random() * (s.w - 2 * m), y = s.y + m + Math.random() * (s.h - 2 * m);
    if (!outraSala(x, y)) return { x, y };
  }
  return { x: s.x + s.w / 2, y: s.y + s.h / 2 };
}
function atualizarBonecos() {
  if (!cena) return;
  const ativos = editando ? {} : dados.canais;
  for (const c of dados.planta.cameras) {
    const tipo = ativos[c.canal], b = bonecos.get(c.canal);
    if (tipo && (!b || b.tipo !== tipo || b.sumindo)) {
      if (b) { cena.remove(b.grupo); descartar(b.grupo); }
      const g = novoBoneco(tipo), ini = pontoNaArea(c);
      g.position.set(ini.x, 0, ini.y);
      bonecos.set(c.canal, { grupo: g, alvo: pontoNaArea(c), tipo, cam: c, sumindo: false, pausa: 0 });
    } else if (!tipo && b && !b.sumindo) b.sumindo = true;
  }
  for (const [canal, b] of bonecos) if (!dados.planta.cameras.some(c => c.canal === canal)) { cena.remove(b.grupo); descartar(b.grupo); bonecos.delete(canal); }
}
function moverBonecos(dt, t) {
  for (const [canal, b] of bonecos) {
    const g = b.grupo;
    if (b.sumindo) {
      g.userData.mat.opacity -= dt * 1.2;
      g.userData.etiqueta.material.opacity = g.userData.mat.opacity;
      if (g.userData.mat.opacity <= 0) { cena.remove(g); descartar(g); bonecos.delete(canal); }
      continue;
    }
    if (b.pausa > 0) { b.pausa -= dt; continue; }
    const dx = b.alvo.x - g.position.x, dz = b.alvo.y - g.position.z, d = Math.hypot(dx, dz);
    if (d < 3) { b.alvo = pontoNaArea(b.cam); b.pausa = .5 + Math.random() * 2; continue; }
    const v = Math.min(d, 38 * dt);                   // ~1 m/s na escala da planta
    g.position.x += dx / d * v; g.position.z += dz / d * v;
    g.rotation.y = Math.atan2(dx, dz);
    const passo = Math.sin(t * 9) * .5;
    g.userData.pernas[0].rotation.x = passo; g.userData.pernas[1].rotation.x = -passo;
  }
}

let ultimoQuadro = 0, clique0 = null;
function animar(t) {
  requestAnimationFrame(animar);
  if (document.hidden || t - ultimoQuadro < 33) return;     // ~30 quadros/s e nada com a janela escondida
  const dt = Math.min((t - ultimoQuadro) / 1000, .1);
  ultimoQuadro = t;
  moverBonecos(dt, t / 1000);
  controles.update();
  renderer.render(cena, camera);
}

function vistaDeCima(ligar) {
  $("bt-vista").setAttribute("aria-pressed", ligar);
  const cx = larguraP / 2, cz = alturaP / 2;
  controles.target.set(cx, 0, cz);
  if (ligar) camera.position.set(cx, 1700, cz + 1);
  else camera.position.set(cx - 520, 760, cz + 860);
  controles.enableRotate = !ligar;
  controles.update();
}

function aoClicar(e) {
  if (!clique0 || Math.hypot(e.clientX - clique0[0], e.clientY - clique0[1]) > 6) return;   // foi arrastar, não clicar
  const r = renderer.domElement.getBoundingClientRect();
  const ponto = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raio.setFromCamera(ponto, camera);
  const acerto = raio.intersectObjects(grupoCams.children, true).find(i => i.object.userData.canal);
  if (acerto && !(editando && canalSel && !rascunho.some(c => c.canal === canalSel))) {
    const canal = acerto.object.userData.canal;
    editando ? escolherCanal(canal) : verCamera(canal);
    return;
  }
  if (editando && canalSel) {
    const p = raio.intersectObject(chao)[0];
    if (!p) return;
    const c = rascunho.find(x => x.canal === canalSel);
    if (c) { c.x = Math.round(p.point.x); c.y = Math.round(p.point.z); }
    else rascunho.push({ canal: canalSel, x: Math.round(p.point.x), y: Math.round(p.point.z), ang: 45, nome: "" });
    listaCanais(); montarCameras();
  }
}

// ---------------------------------------------------------------- painel lateral
async function atualizar() {
  try {
    dados = DEMO ? demo() : await (await fetch(q("/hud/cameras/dados"), { cache: "no-store" })).json();
  } catch (e) { $("rodape").textContent = "sem resposta do Ghost: " + e; return; }
  if (!editando) rascunho = dados.planta.cameras.map(c => ({ ...c }));
  if (cena) { montarPlanta(dados.planta); montarCameras(); atualizarBonecos(); }
  painel();
}
function painel() {
  const ativos = Object.values(dados.canais), ok = dados.estado === "conectado";
  $("contas").innerHTML = `<span class="${ok ? "bom" : "ruim"}">gravador <b>${dados.gravador || "—"}</b> ${ok ? "conectado" : dados.estado}</span>`
    + `<span>câmeras na planta <b>${dados.planta.cameras.length}</b>/${Object.keys(dados.titulos).length || "?"}</span>`
    + `<span>pessoa <b>${ativos.filter(v => v === "pessoa").length}</b></span>`
    + `<span>movimento <b>${ativos.filter(v => v === "movimento").length}</b></span>`;
  const aviso = !dados.configurado ? "Faltam CAM_GRAVADOR, CAM_USUARIO e CAM_SENHA no .env." : dados.erro;
  $("aviso").hidden = !aviso; $("aviso-texto").textContent = aviso || "";
  $("ultimos").innerHTML = dados.ultimos.length ? dados.ultimos.map(u => {
    const c = dados.planta.cameras.find(x => x.canal === u.canal);
    return `<li><span><b class="tag-${u.tipo}">${u.tipo}</b> · ${c ? nomeCam(c) : (dados.titulos[u.canal] || "CAM " + u.canal)}</span><span>${hora(u.t)}</span></li>`;
  }).join("") : '<li><span class="sub">Nenhum evento ainda.</span><span></span></li>';
  $("rodape").textContent = "atualizado " + hora(dados.gerado) + (DEMO ? " · demonstração" : "")
    + " · O boneco mostra que há alguém NA ÁREA da câmera; o caminho dele é ilustrativo. \"Pessoa\" exige o SMD Plus ligado no gravador.";
  if (editando) listaCanais();
}

function verCamera(canal) {
  verCanal = canal;
  const c = dados.planta.cameras.find(x => x.canal === canal);
  $("ficha").innerHTML = `<h2>${(c ? nomeCam(c) : "CAM " + canal).toUpperCase()}</h2>
    <div class="sub">canal ${canal} · ${dados.canais[canal] ? `<span class="tag-${dados.canais[canal]}">${dados.canais[canal]} agora</span>` : "sem evento agora"}</div>
    <div class="tela" id="tela"><span>${DEMO ? "imagem ao vivo (no Ghost)" : "conectando à câmera…"}</span></div>
    <div class="sub">Imagem reduzida, só enquanto esta ficha estiver aberta.</div>`;
  if (cena) montarCameras();
}
async function puxarFoto() {
  const canal = editando ? canalSel : verCanal;
  if (!canal || DEMO) return;
  try {
    const r = await fetch(q(`/hud/cameras/foto?canal=${canal}`), { cache: "no-store" });
    const tela = $("tela");
    if (!tela) return;
    if (r.status === 200) {
      const url = URL.createObjectURL(await r.blob());
      let img = tela.querySelector("img");
      if (!img) { tela.replaceChildren(); img = document.createElement("img"); img.alt = "Imagem ao vivo"; tela.appendChild(img); }
      img.src = url; if (fotoUrl) URL.revokeObjectURL(fotoUrl); fotoUrl = url;
    } else if (r.status !== 202) tela.innerHTML = `<span>${(await r.json()).erro || "sem imagem"}</span>`;
  } catch (e) { /* tenta no próximo ciclo */ }
}

function modoEdicao(ligar) {
  editando = ligar; canalSel = null; verCanal = null;
  rascunho = dados.planta.cameras.map(c => ({ ...c }));
  $("cena").classList.toggle("editando", ligar);
  for (const id of ["edicao", "bt-salvar", "bt-cancelar"]) $(id).hidden = !ligar;
  $("bt-editar").hidden = ligar;
  $("ficha").innerHTML = '<h2>DETALHE</h2><div class="sub">Clique numa câmera para ver a imagem ao vivo.</div>';
  if (cena) { vistaDeCima(ligar); atualizarBonecos(); montarCameras(); }
  if (ligar) listaCanais();
}
function listaCanais() {
  const total = Math.max(Object.keys(dados.titulos).length, 1);
  $("lista-canais").innerHTML = Array.from({ length: total }, (_, i) => i + 1).map(n =>
    `<button type="button" data-canal="${n}" aria-pressed="${canalSel === n}" class="${rascunho.some(c => c.canal === n) ? "na-planta" : ""}">${dados.titulos[n] || "CAM " + n}</button>`).join("");
  $("lista-canais").querySelectorAll("button").forEach(b => b.onclick = () => escolherCanal(+b.dataset.canal));
  const c = rascunho.find(x => x.canal === canalSel);
  const viva = !canalSel ? "" : `<div class="tela" id="tela"><span>${DEMO ? "imagem ao vivo (no Ghost)" : "conectando à câmera…"}</span></div>
    <div class="sub">Imagem ao vivo do ${dados.titulos[canalSel] || "CAM " + canalSel}: veja o que ela mostra antes de posicionar.</div>`;
  if (canalSel && $("tela") && $("edicao-cam").dataset.canal == canalSel && !c === !$("cam-nome")) return;   // não pisca a imagem
  $("edicao-cam").dataset.canal = canalSel || "";
  const salas = dados.planta.salas.map(s => `<option value="${s.id}" ${c && c.sala === s.id ? "selected" : ""}>${s.nome}</option>`).join("");
  $("edicao-cam").innerHTML = !canalSel ? "" : viva + (!c ? `<div class="sub" style="margin-top:10px">Clique no chão da planta para colocar o canal ${canalSel}.</div>` :
    `<label>Sala que esta câmera vê<select id="cam-sala"><option value="">automática (${salaDaCamera({ ...c, sala: "" }).nome})</option>${salas}</select></label>
     <label>Nome da câmera (só no Ghost)<input type="text" id="cam-nome" maxlength="40" value="${(c.nome || "").replace(/"/g, "&quot;")}" placeholder="${dados.titulos[c.canal] || ""}"></label>
     <div class="linha"><button type="button" id="girar-e">↺ Girar</button><button type="button" id="girar-d">↻ Girar</button><button type="button" id="tirar">Tirar da planta</button></div>
     <div class="sub" style="margin-top:6px">Para mudar de lugar, clique de novo no chão.</div>`);
  if (c) {
    $("cam-sala").onchange = e => { c.sala = e.target.value; montarCameras(); };
    $("cam-nome").oninput = e => { c.nome = e.target.value; montarCameras(); };
    $("girar-e").onclick = () => { c.ang = (c.ang + 315) % 360; montarCameras(); };
    $("girar-d").onclick = () => { c.ang = (c.ang + 45) % 360; montarCameras(); };
    $("tirar").onclick = () => { rascunho = rascunho.filter(x => x !== c); listaCanais(); montarCameras(); };
  }
}
function escolherCanal(n) { canalSel = n; listaCanais(); if (cena) montarCameras(); }

$("bt-vista").onclick = () => { if (cena) vistaDeCima($("bt-vista").getAttribute("aria-pressed") !== "true"); };
$("bt-editar").onclick = () => modoEdicao(true);
$("bt-cancelar").onclick = () => modoEdicao(false);
$("bt-salvar").onclick = async () => {
  if (!DEMO) {
    const r = await fetch(q("/hud/cameras/editar"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cameras: rascunho }) });
    if (!r.ok) { $("rodape").textContent = "Não consegui salvar: " + ((await r.json()).erro || r.status); return; }
    dados.planta.cameras = (await r.json()).cameras;
  } else dados.planta.cameras = rascunho;
  modoEdicao(false);
};

iniciar3D();
atualizar();
setInterval(atualizar, 1000);
setInterval(puxarFoto, 600);
</script>
</body>
</html>
